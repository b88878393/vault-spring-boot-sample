name: Bug report
description: Something in the sample does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste real secrets, tokens, role IDs or secret IDs** into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. ./scripts/vault-init.sh
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker version, JDK version, branch/commit"
